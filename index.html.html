<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jax Game Mini</title>
<style>
:root{--bg:#0b1022;--panel:#151d38;--panel2:#202b4e;--purple:#8b5cf6;--blue:#38bdf8;--text:#f8fafc;--muted:#b8c4e4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#20275a 0,#0b1022 48%);font-family:Arial,sans-serif;color:var(--text)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px max(5%,calc((100% - 1100px)/2));background:#0b1022dd;position:sticky;top:0;border-bottom:1px solid #ffffff18;z-index:2}
.logo{font-weight:900;letter-spacing:1px;color:#c4b5fd;font-size:20px}nav a{color:var(--muted);text-decoration:none;margin-left:18px}
.hero{text-align:center;padding:55px 20px 35px}.mascot{font-size:66px;filter:drop-shadow(0 0 18px #8b5cf6)}h1{font-size:clamp(30px,5vw,52px);margin:8px 0;color:white}.gradient{background:linear-gradient(90deg,#c4b5fd,#38bdf8);background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px}.pill{display:inline-block;background:#312e81;color:#ddd6fe;border:1px solid #8b5cf6;padding:8px 14px;border-radius:30px;font-size:12px;font-weight:bold}
main{max-width:1100px;margin:auto;padding:20px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}.section-title p{color:var(--muted);margin:5px 0 18px}
.search{width:min(100%,300px);padding:12px 14px;border-radius:12px;border:1px solid #344064;background:#111a33;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid #ffffff12;border-radius:18px;padding:18px;box-shadow:0 10px 25px #0003}.emoji{font-size:40px}.card h3{margin:10px 0 5px}.card p{color:var(--muted);min-height:36px;font-size:14px}
button{border:0;border-radius:11px;background:linear-gradient(100deg,var(--purple),#536dfe);color:white;padding:11px 15px;font-weight:bold;cursor:pointer}button:hover{filter:brightness(1.13)}button:disabled{opacity:.5;cursor:not-allowed}.play{width:100%}
#gameBox{display:none;margin:28px 0;background:var(--panel);border:1px solid #8b5cf655;border-radius:18px;padding:22px;min-height:170px}#gameBox h2{margin-top:0}.game-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.game-output{color:#c4b5fd;font-weight:bold;margin-top:15px;min-height:24px}input{padding:10px;border-radius:9px;border:1px solid #526080;background:#0b1022;color:white;width:110px}
.tile{width:58px;height:58px;font-size:23px;margin:4px;background:#303d68}.board{display:grid;grid-template-columns:repeat(3,65px);gap:5px}.memory{display:grid;grid-template-columns:repeat(4,55px);gap:7px}.memory button{height:55px;padding:0;font-size:22px}
footer{text-align:center;padding:28px;color:#9aa8ce;border-top:1px solid #ffffff15;margin-top:40px;font-size:13px}
@media(max-width:560px){header{padding:15px}nav a{margin-left:9px;font-size:13px}.hero{padding-top:38px}.section-title{align-items:stretch}.search{width:100%}}
</style>
</head>
<body>
<header><div class="logo">👾 JAX GAME MINI</div><nav><a href="#home">Home</a><a href="#games">Games</a></nav></header>
<section class="hero" id="home"><div class="mascot">👾</div><h1>WELCOME TO <span class="gradient">JAX GAME MINI</span></h1><p>Play. Have Fun. Repeat.</p><span class="pill">10 FREE MINI-GAMES · NO LOGIN</span></section>
<main id="games">
<div class="section-title"><div><h2>Choose Your Game</h2><p>Pick a game and start playing instantly.</p></div><input class="search" id="search" placeholder="Search games..." oninput="filterGames()"></div>
<div class="grid" id="gameGrid"></div>
<section id="gameBox"><div class="section-title"><h2 id="gameTitle">Game</h2><button onclick="closeGame()">Close ✕</button></div><div id="gameContent"></div><div class="game-output" id="gameOutput" aria-live="polite"></div></section>
</main>
<footer>© 2026 Jax Game Mini · Made for fun</footer>
<script>
const games=[
["number","🔢","Number Guess","Guess the secret number from 1 to 20.","Puzzle"],
["rps","✊","Rock Paper Scissors","Play the classic game against the computer.","Classic"],
["click","⚡","Click Challenge","How many times can you click in 10 seconds?","Arcade"],
["tic","⭕","Tic Tac Toe","Get three marks in a row to win.","Board"],
["memory","🧠","Memory Match","Find all matching pairs of cards.","Puzzle"],
["snake","🐍","Snake Game","Collect the dots and grow your snake.","Arcade"],
["math","➗","Math Challenge","Solve quick maths questions.","Learning"],
["mole","🔨","Whack-a-Mole","Tap the mole when it appears.","Arcade"],
["color","🎨","Color Match","Choose the color named on the screen.","Puzzle"],
["reaction","🚦","Reaction Test","Wait for green, then click quickly.","Speed"]
];
const grid=document.getElementById("gameGrid");
games.forEach(g=>{const c=document.createElement("article");c.className="card";c.dataset.name=g[2].toLowerCase();c.innerHTML=`<div class="emoji">${g[1]}</div><h3>${g[2]}</h3><p>${g[3]}</p><small style="color:#a5b4fc">${g[4]}</small><br><br><button class="play" onclick="startGame('${g[0]}')">PLAY NOW ▶</button>`;grid.appendChild(c)});
function filterGames(){const q=document.getElementById("search").value.toLowerCase();document.querySelectorAll(".card").forEach(c=>c.style.display=c.dataset.name.includes(q)?"block":"none")}
const box=document.getElementById("gameBox"),content=document.getElementById("gameContent"),out=document.getElementById("gameOutput");
let cleanup=()=>{};function open(title,html){cleanup();document.getElementById("gameTitle").textContent=title;content.innerHTML=html;out.textContent="";box.style.display="block";box.scrollIntoView({behavior:"smooth",block:"center"})}
function say(t){out.textContent=t}function closeGame(){cleanup();box.style.display="none";content.innerHTML=""}
function startGame(id){
if(id==="number"){let n=1+Math.floor(Math.random()*20),tries=0;open("🔢 Number Guess",`<p>Guess a number between 1 and 20.</p><input id="g" type="number" min="1" max="20"><button id="go">Guess</button><button id="again">New number</button>`);const check=()=>{let v=Number(document.getElementById("g").value);if(!v||v<1||v>20)return say("Enter a number from 1 to 20.");tries++;say(v===n?`🎉 Correct! You got it in ${tries} tries.`:v<n?"Too low. Try again!":"Too high. Try again!")};document.getElementById("go").onclick=check;document.getElementById("again").onclick=()=>{n=1+Math.floor(Math.random()*20);tries=0;say("New number ready!")}}
if(id==="rps"){open("✊ Rock Paper Scissors",`<p>Choose your move:</p><div class="game-actions"><button data-v="0">✊ Rock</button><button data-v="1">✋ Paper</button><button data-v="2">✌️ Scissors</button></div>`);content.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{let p=+b.dataset.v,c=Math.floor(Math.random()*3),names=["Rock","Paper","Scissors"],r=(p-c+3)%3;say(`You: ${names[p]} · Computer: ${names[c]} — ${r===0?"Tie!":r===1?"You win! 🎉":"Computer wins!"}`)})}
if(id==="click"){let count=0,left=10,active=false;open("⚡ Click Challenge",`<p>Press start, then click as fast as you can for 10 seconds.</p><h3 id="clock">10 seconds</h3><h3 id="score">Clicks: 0</h3><button id="start">Start</button><button id="hit" disabled>CLICK ME!</button>`);let timer;document.getElementById("start").onclick=()=>{count=0;left=10;active=true;document.getElementById("hit").disabled=false;document.getElementById("score").textContent="Clicks: 0";timer=setInterval(()=>{left--;document.getElementById("clock").textContent=left+" seconds";if(left<=0){clearInterval(timer);active=false;document.getElementById("hit").disabled=true;say(`Time's up! You scored ${count} clicks.`)}},1000)};document.getElementById("hit").onclick=()=>{if(active){count++;document.getElementById("score").textContent="Clicks: "+count}};cleanup=()=>clearInterval(timer)}
if(id==="tic"){let board=Array(9).fill(""),turn="X",done=false;open("⭕ Tic Tac Toe",`<p>Take turns: X goes first.</p><div class="board" id="board">${board.map((_,i)=>`<button class="tile" data-i="${i}"></button>`).join("")}</div><button id="reset">Restart</button>`);const win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function draw(){content.querySelectorAll("[data-i]").forEach((b,i)=>b.textContent=board[i]);let w=win.find(a=>board[a[0]]&&board[a[0]]===board[a[1]]&&board[a[1]]===board[a[2]]);if(w){done=true;say(turn+" wins! 🎉")}else if(board.every(Boolean)){done=true;say("It's a draw!")}}content.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(done||board[i])return;board[i]=turn;draw();if(!done){turn=turn==="X"?"O":"X";say(turn+"'s turn")}});document.getElementById("reset").onclick=()=>{board.fill("");turn="X";done=false;draw();say("X goes first.")}}
if(id==="memory"){let vals=["🍉","🚀","🐱","⭐","🍉","🚀","🐱","⭐"].sort(()=>Math.random()-.5),openCards=[],matched=0;open("🧠 Memory Match",`<p>Find the matching pairs.</p><div class="memory" id="mem">${vals.map((v,i)=>`<button data-i="${i}">?</button>`).join("")}</div>`);content.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(b.disabled||openCards.some(x=>x.i===i)||openCards.length===2)return;b.textContent=vals[i];openCards.push({i,b});if(openCards.length===2){if(vals[openCards[0].i]===vals[openCards[1].i]){openCards.forEach(x=>x.b.disabled=true);matched+=2;openCards=[];if(matched===8)say("You found every pair! 🎉")}else{let pair=openCards;setTimeout(()=>{pair.forEach(x=>x.b.textContent="?");openCards=[]},650)}}})}
if(id==="snake"){open("🐍 Snake Game",`<p>Use arrow keys to move. Eat the red dot. Avoid the walls and yourself.</p><canvas id="snake" width="300" height="300" style="max-width:100%;background:#0b1022;border:2px solid #526080;border-radius:10px"></canvas><p>Score: <b id="snakeScore">0</b></p><button id="snakeStart">Start / Restart</button>`);let cv=document.getElementById("snake"),ctx=cv.getContext("2d"),s=[{x:7,y:7}],d={x:1,y:0},food={x:12,y:7},score=0,timer;function draw(){ctx.clearRect(0,0,300,300);ctx.fillStyle="#38bdf8";s.forEach(p=>ctx.fillRect(p.x*15,p.y*15,13,13));ctx.fillStyle="#fb7185";ctx.fillRect(food.x*15,food.y*15,13,13)}function step(){let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||s.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);say("Game over! Score: "+score);return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById("snakeScore").textContent=score;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}else s.pop();draw()}function key(e){let map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};if(map[e.key]){e.preventDefault();let nd=map[e.key];if(nd.x!==-d.x||nd.y!==-d.y)d=nd}}document.addEventListener("keydown",key);document.getElementById("snakeStart").onclick=()=>{clearInterval(timer);s=[{x:7,y:7}];d={x:1,y:0};score=0;document.getElementById("snakeScore").textContent=0;food={x:12,y:7};draw();timer=setInterval(step,130)};draw();cleanup=()=>{clearInterval(timer);document.removeEventListener("keydown",key)}}
if(id==="math"){let a,b;open("➗ Math Challenge",`<p id="question"></p><input id="answer" type="number"><button id="check">Check</button><button id="next">Next question</button>`);function next(){a=1+Math.floor(Math.random()*12);b=1+Math.floor(Math.random()*12);document.getElementById("question").textContent=`What is ${a} × ${b}?`;document.getElementById("answer").value=""}document.getElementById("check").onclick=()=>say(Number(document.getElementById("answer").value)===a*b?"Correct! 🎉":"Not quite. Try again.");document.getElementById("next").onclick=next;next()}
if(id==="mole"){let score=0,active=false,timer;open("🔨 Whack-a-Mole",`<p>Click the mole as it moves. You have 15 seconds.</p><h3 id="mScore">Score: 0</h3><button id="mStart">Start</button><div id="mArea" style="margin-top:12px;min-height:60px"></div>`);let area=document.getElementById("mArea");function spawn(){area.innerHTML='<button style="font-size:28px" id="moleBtn">🐹</button>';document.getElementById("moleBtn").onclick=()=>{if(active){score++;document.getElementById("mScore").textContent="Score: "+score;spawn()}}}document.getElementById("mStart").onclick=()=>{score=0;active=true;document.getElementById("mScore").textContent="Score: 0";spawn();timer=setTimeout(()=>{active=false;area.innerHTML="";say("Time's up! Score: "+score)},15000)};cleanup=()=>clearTimeout(timer)}
if(id==="color"){let names=["PURPLE","BLUE","GREEN","ORANGE","PINK"],colors=["#a78bfa","#38bdf8","#4ade80","#fb923c","#f472b6"],correct;open("🎨 Color Match",`<p>Choose the button that matches the word's color.</p><h2 id="colorWord"></h2><div id="colorBtns" class="game-actions"></div>`);function round(){let i=Math.floor(Math.random()*5);correct=i;let word=document.getElementById("colorWord");word.textContent=names[i];word.style.color=colors[Math.floor(Math.random()*5)];let order=[0,1,2,3,4].sort(()=>Math.random()-.5);document.getElementById("colorBtns").innerHTML=order.map(j=>`<button data-c="${j}" style="background:${colors[j]}">${names[j]}</button>`).join("");content.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{if(+b.dataset.c===correct){say("Correct! 🎉");round()}else say("Try again!")})}round()}
if(id==="reaction"){open("🚦 Reaction Test",`<p>Press start. Wait until the panel turns green, then click it as quickly as you can.</p><button id="react" style="width:100%;min-height:100px;background:#64748b">Press START</button>`);let btn=document.getElementById("react"),ready=false,startAt=0,timeout;btn.onclick=()=>{if(btn.textContent==="Press START"){btn.textContent="Wait for green...";btn.style.background="#b45309";timeout=setTimeout(()=>{ready=true;startAt=performance.now();btn.textContent="CLICK NOW!";btn.style.background="#16a34a"},1200+Math.random()*3000)}else if(ready){let ms=Math.round(performance.now()-startAt);ready=false;btn.textContent="Press START";btn.style.background="#64748b";say(`Your reaction time: ${ms} milliseconds!`)}else if(btn.textContent==="Wait for green..."){clearTimeout(timeout);btn.textContent="Too early! Press START";btn.style.background="#64748b"}};cleanup=()=>clearTimeout(timeout)}
}
</script>
</body></html>
